name: Deploy form guide

on:
  push:
    branches: [master]
    paths:
      - 'form_guide_web/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/guide-pages.yml'
  workflow_dispatch:

# Read-only by default; only the deploy job gets the write scopes it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: form_guide_web
      # Fail the deploy when something is undocumented.
      - run: flutter test
        working-directory: form_guide_web
      # Project pages live at https://<user>.github.io/<repo>/
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        working-directory: form_guide_web
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: form_guide_web/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
