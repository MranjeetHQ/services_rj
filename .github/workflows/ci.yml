name: CI

# One workflow, one verify job (steps run in order), then an optional deploy.
# Pull requests only verify. A push to master verifies and then publishes the
# form guide to GitHub Pages.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Read-only token by default; the deploy job adds only what it needs.
permissions:
  contents: read

# Never run two copies for the same ref. A newer push cancels an older
# pull request run, but a deploy is never cancelled half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      # ── Package ──────────────────────────────────────────────
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
      # Before the steps below: their `pub get` rewrites tracked lock files,
      # and a dirty tree would make the dry run warn.
      - name: Check pub score readiness
        run: flutter pub publish --dry-run

      # ── Example app ──────────────────────────────────────────
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --fatal-infos
        working-directory: example
      - run: flutter test
        working-directory: example

      # ── Form guide website ───────────────────────────────────
      - run: flutter pub get
        working-directory: form_guide_web
      - run: flutter analyze --fatal-infos
        working-directory: form_guide_web
      # Fails when a field, property, validator or operator is undocumented.
      - run: flutter test
        working-directory: form_guide_web
      # Project pages live at https://<owner>.github.io/<repo>/
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        working-directory: form_guide_web
      - name: Upload site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: form_guide_web/build/web

  deploy:
    name: Deploy guide
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
