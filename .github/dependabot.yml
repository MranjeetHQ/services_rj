version: 2
updates:
  # One grouped pull request per ecosystem instead of one per dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pub:
        patterns: ['*']
